<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link href="./css/feedback.css" rel="stylesheet">
</head>
<body>

    <main class="feedback">

        <div class="cabecalho">
            <h1>Feedback</h1>
            <p>
                Queremos saber como foi sua experiência! Por favor, preencha o formulário abaixo com suas informações e comentários. Sua opinião é muito importante para nós e nos ajudará a melhorar nossos produtos e serviços.
            </p>
        </div>

        <form id="formFeedback">

            <div class="campo">
                <label for="nome">Nome</label>
                <input 
                    type="text" 
                    id="nome" 
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="campo">
                <label>Avalie sua experiência</label>

                <div class="estrelas">
                    <button type="button" data-nota="1">★</button>
                    <button type="button" data-nota="2">★</button>
                    <button type="button" data-nota="3">★</button>
                    <button type="button" data-nota="4">★</button>
                    <button type="button" data-nota="5">★</button>
                </div>

                <input 
                    type="hidden" 
                    id="nota" 
                    name="nota"
                >
            </div>

            <div class="campo">
                <label for="comentario">Comentário</label>

                <textarea
                    id="comentario"
                    name="comentario"
                    rows="5"
                    placeholder="Conte-nos como foi sua experiência..."
                    required
                ></textarea>
            </div>

            <button type="submit" class="btn-enviar">
                Enviar Feedback
            </button>

        </form>

    </main>

    <script src="./js/feedback.js"></script>
    
</body>
</html>
