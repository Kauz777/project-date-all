<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini IA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #080808;
            color: white;

            font-family: Arial, sans-serif;
        }

        .chat {
            width: 90%;
            max-width: 450px;

            padding: 20px;

            background: #151515;
            border: 1px solid #292929;
            border-radius: 16px;
        }

        h1 {
            margin-bottom: 15px;
        }

        #mensagens {
            height: 300px;
            overflow-y: auto;

            padding: 10px;

            margin-bottom: 15px;
        }

        .mensagem {
            padding: 10px 12px;
            margin-bottom: 10px;

            border-radius: 10px;

            line-height: 1.4;
        }

        .usuario {
            background: #292929;
            text-align: right;
        }

        .ia {
            background: #202020;
            color: #8ee6a8;
        }

        .entrada {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;

            padding: 12px;

            background: #0d0d0d;
            color: white;

            border: 1px solid #333;
            border-radius: 8px;

            outline: none;
            font-size: 16px;
        }

        button {
            padding: 12px 16px;

            border: none;
            border-radius: 8px;

            cursor: pointer;

            background: white;
            color: black;
        }
    </style>
</head>

<body>

    <div class="chat">

        <h1>🤖 Mini IA</h1>

        <div id="mensagens"></div>

        <div class="entrada">

            <input
                type="text"
                id="entrada"
                placeholder="Digite alguma coisa..."
                autocomplete="off"
            >

            <button id="enviar">
                Enviar
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
